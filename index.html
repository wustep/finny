<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finny</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Paint in the right theme from the first frame. next-themes sets this
      // class too, but only once React has mounted — long enough for a white
      // page to flash at anyone who chose dark. Keep the storage key in step
      // with the ThemeProvider in src/main.tsx.
      try {
        var stored = localStorage.getItem("finny.theme");
        var dark =
          stored === "dark" ||
          ((!stored || stored === "system") &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (error) {
        // Storage can be blocked entirely; light is the default either way.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
